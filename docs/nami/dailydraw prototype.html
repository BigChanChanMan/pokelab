<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DailyDraw · 每日一抽</title>
<style>
  :root{
    --bg:#08090d; --bg2:#0e1118; --panel:#141822; --panel2:#1a1f2c;
    --ink:#eef1f7; --ink2:#939fb4; --ink3:#5b6678;
    --line:#212836; --line2:#313a4c;
    --gold:#e8b339; --gold2:#f7dc8a; --red:#e63946;
    --blue:#4d9de0; --green:#3ddc97; --purple:#9d6cde;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(ellipse at 50% -10%,#151a26 0%,var(--bg) 55%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit}

  /* 顶部 */
  .topbar{position:sticky;top:0;z-index:80;background:rgba(8,9,13,.9);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .tb{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
  .logo{font-weight:800;font-size:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
  .navs{display:flex;gap:2px;flex:1}
  .navs button{background:none;border:0;color:var(--ink2);padding:6px 12px;border-radius:7px;
    cursor:pointer;font-size:13.5px;transition:.15s}
  .navs button:hover{background:var(--panel);color:var(--ink)}
  .navs button.on{background:var(--gold);color:#1a1405;font-weight:650}
  .rattag{font-size:11.5px;color:var(--ink3);border:1px solid var(--line2);padding:3px 9px;border-radius:20px}

  main{max-width:1080px;margin:0 auto;padding:26px 20px 90px}

  /* 抽卡主区 */
  .stage{display:flex;flex-direction:column;align-items:center;padding:20px 0 10px;position:relative}
  .datelabel{color:var(--ink3);font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;margin-bottom:18px}

  .cardslot{width:280px;aspect-ratio:245/342;position:relative;perspective:1400px;margin-bottom:24px}
  @media(max-width:520px){.cardslot{width:232px}}

  .cardface{position:absolute;inset:0;border-radius:14px;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,.15,.25,1)}
  .cardface.flipped{transform:rotateY(180deg)}
  .cf-front,.cf-back{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;
    overflow:hidden;display:flex;align-items:center;justify-content:center}
  .cf-back{background:
      repeating-linear-gradient(45deg,#1a2030 0 12px,#161b28 12px 24px);
    border:1px solid var(--line2);cursor:pointer;box-shadow:0 16px 44px rgba(0,0,0,.6)}
  .cf-back .emblem{width:88px;height:88px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#f7dc8a,#e8b339 45%,#8a6410 100%);
    display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900;color:#241a04;
    box-shadow:0 0 34px rgba(232,179,57,.45),inset 0 -4px 12px rgba(0,0,0,.35)}
  .cf-front{transform:rotateY(180deg);background:var(--panel);border:1px solid var(--line2)}
  .cf-front img{width:100%;height:100%;object-fit:contain;display:block}
  .cf-front .noimg{padding:20px;text-align:center;color:var(--ink3);font-size:13px}

  /* 呼吸脉冲 */
  .pulse{animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1);filter:brightness(1)}
                   50%{transform:scale(1.035);filter:brightness(1.14)}}
  .cardface .glowring{position:absolute;inset:-3px;border-radius:16px;pointer-events:none;opacity:0}
  .glowring.on{opacity:1}
  .g-N{box-shadow:0 0 0 2px #8b95a7,0 0 26px rgba(139,149,167,.5)}
  .g-R{box-shadow:0 0 0 2px var(--blue),0 0 34px rgba(77,157,224,.75)}
  .g-SR{box-shadow:0 0 0 2px var(--purple),0 0 44px rgba(157,108,222,.85)}
  .g-SSR{box-shadow:0 0 0 3px var(--gold),0 0 60px rgba(232,179,57,.95)}
  .g-UR{box-shadow:0 0 0 3px var(--red),0 0 80px rgba(230,57,70,1),0 0 130px rgba(247,220,138,.7)}

  /* 白光过曝 */
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
  .flash.go{animation:flash .5s ease-out}
  @keyframes flash{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}

  /* 粒子 */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
  .pt{position:absolute;border-radius:50%;animation:burst 1.5s ease-out forwards}
  @keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}
                   100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

  .mainbtn{background:linear-gradient(135deg,var(--gold),#c9962a);border:0;color:#1a1405;
    padding:15px 44px;border-radius:12px;font-size:16px;font-weight:750;cursor:pointer;
    box-shadow:0 10px 30px rgba(232,179,57,.32);transition:.18s;letter-spacing:.02em}
  .mainbtn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 38px rgba(232,179,57,.45)}
  .mainbtn:disabled{opacity:.45;cursor:not-allowed;transform:none}

  .result{text-align:center;max-width:560px;margin:0 auto}
  .result h2{margin:0 0 4px;font-size:26px;letter-spacing:-.5px}
  .result .setline{color:var(--ink2);font-size:13px;display:flex;align-items:center;
    justify-content:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .result .setline img{height:19px}
  .pill{display:inline-block;padding:3px 13px;border-radius:20px;font-size:12.5px;font-weight:700;
    font-family:var(--mono);letter-spacing:.04em}
  .p-N{background:#2a3040;color:#aab4c6}
  .p-R{background:#12324f;color:#7cc0f5;border:1px solid var(--blue)}
  .p-SR{background:#2a1c47;color:#c1a0f5;border:1px solid var(--purple)}
  .p-SSR{background:#3d3009;color:var(--gold2);border:1px solid var(--gold)}
  .p-UR{background:linear-gradient(120deg,#4a1019,#3d3009);color:#ffd9dc;border:1px solid var(--red)}
  .badgerow{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:12px 0 18px}
  .mini{background:var(--panel);border:1px solid var(--line2);color:var(--ink2);
    padding:3px 11px;border-radius:20px;font-size:11.5px}
  .mini.new{background:#0f2a1c;border-color:var(--green);color:var(--green);font-weight:650}
  .mini.pity{background:#2a1c10;border-color:var(--gold);color:var(--gold);font-weight:650}

  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);
    padding:9px 18px;border-radius:9px;cursor:pointer;font-size:13.5px;transition:.15s}
  .btn:hover{border-color:var(--gold);color:var(--gold2)}
  .btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:650}

  /* 保底条 */
  .pity{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:26px 0 0}
  .pity .it{min-width:170px}
  .pity .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-bottom:5px}
  .pity .lb b{font-family:var(--mono);color:var(--ink2)}
  .pity .track{height:6px;background:#0d1017;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .pity .fill{height:100%;border-radius:5px;transition:width .5s}
  .f-sr{background:linear-gradient(90deg,#6b46a8,#9d6cde)}
  .f-ssr{background:linear-gradient(90deg,#a87c1a,#e8b339)}
  .pity .due{color:var(--gold);font-weight:700}

  .countdown{text-align:center;color:var(--ink2);font-size:13px;margin-top:20px}
  .countdown b{font-family:var(--mono);color:var(--gold2);font-size:15px}

  /* 统计 */
  .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .k{color:var(--ink3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:650}
  .stat .v{font-size:23px;font-weight:750;margin-top:4px;letter-spacing:-.5px}
  .stat .v small{font-size:12px;color:var(--ink2);font-weight:400;margin-left:4px}

  .dist{margin:8px 0}
  .drow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
  .drow .dl{width:52px;font-family:var(--mono);font-weight:700}
  .drow .dt{flex:1;height:9px;background:#0d1017;border-radius:5px;overflow:hidden;border:1px solid var(--line);position:relative}
  .drow .df{height:100%;border-radius:5px}
  .drow .dmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink2);border-radius:2px}
  .drow .dv{width:96px;text-align:right;font-family:var(--mono);color:var(--ink2);font-size:11.5px}
  .df-N{background:#4b5566}.df-R{background:var(--blue)}
  .df-SR{background:var(--purple)}.df-SSR{background:var(--gold)}.df-UR{background:var(--red)}

  /* 时间线 */
  .tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:12px;margin-top:12px}
  .tli{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
    cursor:pointer;transition:.16s;position:relative}
  .tli:hover{transform:translateY(-3px);border-color:var(--gold)}
  .tli .iw{aspect-ratio:245/342;background:var(--bg2);position:relative}
  .tli .iw img{width:100%;height:100%;object-fit:contain;display:block}
  .tli .iw .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--ink3);font-size:11px;padding:6px;text-align:center}
  .tli .cap{padding:7px 9px;border-top:1px solid var(--line)}
  .tli .cap .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tli .cap .dt2{font-size:10.5px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
  .tli .rt{position:absolute;top:6px;left:6px;font-size:10px;font-family:var(--mono);font-weight:700;
    padding:1px 6px;border-radius:10px;backdrop-filter:blur(4px)}
  .tli .dup{position:absolute;top:6px;right:6px;font-size:10px;font-family:var(--mono);
    background:rgba(10,12,18,.85);border:1px solid var(--line2);color:var(--ink2);
    padding:1px 6px;border-radius:10px}

  /* 概率页 */
  .ratecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 19px;margin:14px 0}
  .ratecard h3{margin:0 0 12px;font-size:14.5px}
  .rrow{display:flex;align-items:center;gap:12px;margin:9px 0;font-size:13px}
  .rrow .rl{width:56px;font-family:var(--mono);font-weight:750}
  .rrow .rt{flex:1;height:10px;background:#0d1017;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .rrow .rf{height:100%;border-radius:5px}
  .rrow .rv{width:130px;text-align:right;font-family:var(--mono);color:var(--ink2);font-size:12px}
  .rf-N{background:linear-gradient(90deg,#4b5566,#8b95a7)}
  .rf-R{background:linear-gradient(90deg,#2b6ca8,#4d9de0)}
  .rf-SR{background:linear-gradient(90deg,#6b46a8,#9d6cde)}
  .rf-SSR{background:linear-gradient(90deg,#a87c1a,#e8b339)}
  .rf-UR{background:linear-gradient(90deg,#a8202f,#e63946,#f7dc8a)}

  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px;
    background:var(--panel);border:1px solid var(--line)}
  th{background:#1a1f2c;text-align:left;padding:8px 10px;font-weight:650;font-size:11.5px;
    border-bottom:1px solid var(--line)}
  td{padding:7px 10px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}

  .note{background:#101722;border:1px solid #22334a;color:#9fb6d4;padding:11px 15px;
    border-radius:8px;font-size:12.5px;margin:12px 0}
  .note a,.warn a{white-space:nowrap}
  .warn{background:#221a08;border:1px solid #4a3c10;color:#e0c98a;padding:11px 15px;
    border-radius:8px;font-size:12.5px;margin:12px 0}
  .empty{color:var(--ink3);text-align:center;padding:50px 20px;font-size:13.5px}
  .h1{font-size:24px;margin:0 0 5px;letter-spacing:-.4px}
  .sub{color:var(--ink2);font-size:13.5px;margin:0 0 22px}

  /* 弹层 */
  .mask{position:fixed;inset:0;background:rgba(5,6,9,.86);backdrop-filter:blur(6px);z-index:100;
    display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
  .modal{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;max-width:860px;
    width:100%;position:relative;animation:pop .2s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .modal .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--ink2);
    font-size:25px;cursor:pointer;padding:6px 12px;z-index:3;line-height:1}
  .modal .x:hover{color:var(--ink)}
  .mbody{display:grid;grid-template-columns:300px 1fr}
  .mleft{padding:22px;border-right:1px solid var(--line);background:var(--panel);border-radius:14px 0 0 14px}
  .mleft img{width:100%;border-radius:9px;display:block;background:var(--bg2)}
  .mright{padding:22px 24px}
  .mright h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px;margin-top:14px}
  .kv .k{color:var(--ink3)}
  .sec{margin-top:17px}
  .sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
  .atk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 13px;margin-bottom:7px}
  .atk .r1{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .atk .an{font-weight:650;font-size:14px}
  .atk .ad{margin-left:auto;font-family:var(--mono);font-size:16px;font-weight:750;color:var(--gold)}
  .atk .ef{font-size:12.5px;color:var(--ink2)}
  .energy{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.4)}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--gold);
    color:#1a1405;padding:11px 24px;border-radius:9px;font-weight:650;font-size:13.5px;z-index:200;
    box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s ease-out}
  @media(max-width:760px){.mbody{grid-template-columns:1fr}
    .mleft{border-right:0;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}}
  @media(prefers-reduced-motion:reduce){
    .pulse{animation:none}.pt{display:none}
    .cardface{transition:opacity .25s}.flash.go{animation:none}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="tb">
    <div class="logo" onclick="go('draw')"><span class="dot"></span>DailyDraw</div>
    <div class="navs">
      <button id="nb-draw" onclick="go('draw')">今日一抽</button>
      <button id="nb-album" onclick="go('album')">抽卡册</button>
      <button id="nb-rates" onclick="go('rates')">概率公示</button>
    </div>
    <span class="rattag" id="streaktag">连续 0 天</span>
  </div>
</div>

<main id="app"></main>
<div class="flash" id="flash"></div>
<div class="particles" id="particles"></div>

<script>
/* ================================================================
   DailyDraw · 每日一抽
   数据源：TCGdex REST API  https://api.tcgdex.net/v2
   核心事实（均已对线上 API 实测）：
     · /cards/random 不存在（404），?random=true 返回 []  → 抽卡必须纯客户端
     · /cards 返回的 CardBrief 不含 rarity                 → 无法按稀有度实时筛选
     · 全库约 23,736 张卡，全量拉详情不可行                → 必须构建期采样建池

/* ---------- 档位定义 ---------- */
const TIERS = ['N','R','SR','SSR','UR'];
const TIER_RANK = { N:0, R:1, SR:2, SSR:3, UR:4 };
/* 设计权重（公开公示，见「概率公示」页） */
const WEIGHTS = { N:0.600, R:0.280, SR:0.090, SSR:0.027, UR:0.003 };
const TIER_LABEL = { N:'普通', R:'稀有', SR:'超稀有', SSR:'顶级稀有', UR:'传说' };

/* rarity 原始值 → 档位。显式表 + 兜底，遇到未知值不崩溃 */
const RARITY_TIER = {
  'Common':'N','Uncommon':'N',
  'Rare':'R','Holo Rare':'R','Promo':'R','One Diamond':'R','Two Diamond':'R',
  'Ultra Rare':'SR','Double rare':'SR','Illustration rare':'SR',
  'Three Diamond':'SR','Holo Rare V':'SR','Holo Rare VSTAR':'SR',
  'Secret Rare':'SSR','Special illustration rare':'SSR','Hyper rare':'SSR',
  'Four Diamond':'SSR','Shiny rare':'SSR','ACE SPEC Rare':'SSR',
  'Two Star':'SSR','Crown':'SSR','Two Shiny':'SSR','Mega Hyper Rare':'SSR',
  'One Star':'UR','Pikachu Rare':'UR','Rare Holo LV.X':'UR','Holo Rare VMAX':'UR',
};
function tierOf(rarity){
  if (RARITY_TIER[rarity]) return RARITY_TIER[rarity];
  if (rarity && typeof console !== 'undefined')
    console.warn('[DailyDraw] 未知稀有度，归入 N 档：', rarity);
  return 'N';   // 兜底
}

/* ---------- 确定性随机 ---------- */
const SEED_VERSION = 'dailydraw-v1';
const EPOCH = '2026-01-01';        // 保底推算基准日

function hashSeed(str){
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* 本地日期（不能用 toISOString，那是 UTC，东八区晚上会跨日） */
function localDate(d){
  const t = d || new Date();
  return t.getFullYear() + '-' +
         String(t.getMonth()+1).padStart(2,'0') + '-' +
         String(t.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d + n);
  return localDate(dt);
}
function daysBetween(a, b){
  const out = [];
  let cur = a;
  let guard = 0;
  while (cur <= b && guard++ < 4000){ out.push(cur); cur = addDays(cur, 1); }
  return out;
}

/* ---------- 抽卡内核 ---------- */
function pickTier(r){
  let acc = 0;
  for (const t of TIERS){ acc += WEIGHTS[t]; if (r < acc) return t; }
  return 'N';
}
const BUCKETS = (() => {
  const b = { N:[], R:[], SR:[], SSR:[], UR:[] };
  (POOL || []).forEach(c => { (b[c.tier] || b.N).push(c) });
  return b;
})();

/* 基础抽取（不含保底） */
function baseTierFor(dateStr){
  const rnd = mulberry32(hashSeed(dateStr + '|' + SEED_VERSION));
  return pickTier(rnd());
}
function cardForTier(dateStr, tier){
  const bucket = BUCKETS[tier]?.length ? BUCKETS[tier] : BUCKETS.N;
  const rnd = mulberry32(hashSeed(dateStr + '|' + SEED_VERSION + '|' + tier));
  return bucket[Math.floor(rnd() * bucket.length)];
}

/* 保底状态：从基准日推到目标日（纯计算，无网络） */
function pityStateAt(dateStr){
  let sinceSR = 0, sinceSSR = 0;
  const days = daysBetween(EPOCH, addDays(dateStr, -1));   // 不含当天
  for (const d of days){
    const t = baseTierFor(d);
    if (TIER_RANK[t] >= 2) sinceSR = 0; else sinceSR++;
    if (TIER_RANK[t] >= 3) sinceSSR = 0; else sinceSSR++;
  }
  return { sinceSR, sinceSSR, srDue: sinceSR >= 10, ssrDue: sinceSSR >= 60 };
}

/* 最终抽取（含保底） */
function drawFor(dateStr){
  const p = pityStateAt(dateStr);
  let tier = baseTierFor(dateStr);
  let pity = false;
  if (p.ssrDue && TIER_RANK[tier] < 3){ tier = 'SSR'; pity = true; }
  else if (p.srDue && TIER_RANK[tier] < 2){ tier = 'SR'; pity = true; }
  const card = cardForTier(dateStr, tier);
  return { date: dateStr, card, tier, pity, pityState: p };
}

/* ---------- 存储 ---------- */
const KEY = 'dailydraw.album.v1';
let memFallback = null;
function load(){
  try { return JSON.parse(localStorage.getItem(KEY) || 'null') || { version:1, draws:[], streak:0, lastDrawDate:null } }
  catch { return memFallback || { version:1, draws:[], streak:0, lastDrawDate:null } }
}
function save(st){
  try { localStorage.setItem(KEY, JSON.stringify(st)) } catch { memFallback = st }
}

/* ---------- 状态 ---------- */
const S = {
  view:'draw',
  st: load(),
  flipped:false,
  revealing:false,
  today: localDate(),
  drawResult:null,
  modal:null,
  modalData:null,
  toast:null,
  span:'1m',
};
function todayRecord(){ return S.st.draws.find(d => d.date === S.today) || null }

/* ---------- 视图切换 ---------- */
function go(v){
  S.view = v; S.modal = null;
  document.querySelectorAll('.navs button').forEach(b => b.classList.remove('on'));
  const nb = document.getElementById('nb-' + v); if (nb) nb.classList.add('on');
  window.scrollTo(0,0);
  render();
}

/* ---------- 执行抽卡 ---------- */
function doDraw(){
  if (S.revealing || todayRecord()) return;
  S.revealing = true; S.flipped = false; render();

  const res = drawFor(S.today);
  S.drawResult = res;
  const t = res.tier;

  setTimeout(() => {
    document.getElementById('flash')?.classList.add('go');
    spawnParticles(t);
    if (t === 'UR' && navigator.vibrate) navigator.vibrate([40,60,120]);
  }, 320);

  setTimeout(() => {
    S.flipped = true; render();
    // 落库
    const st = S.st;
    const last = st.lastDrawDate;
    if (last && addDays(last,1) === S.today) st.streak = (st.streak||0)+1;
    else st.streak = 1;
    st.lastDrawDate = S.today;
    st.draws.push({
      date:S.today, cardId:res.card.id, tier:t,
      rarity:res.card.rarity || '', name:res.card.name,
      image:res.card.image || null, isPity:res.pity,
      revealedAt: Date.now(),
    });
    save(st);
    S.revealing = false;
    render();
  }, 1250);
}

function spawnParticles(tier){
  const box = document.getElementById('particles');
  if (!box) return;
  box.innerHTML = '';
  const n = tier==='UR' ? 120 : tier==='SSR' ? 60 : tier==='SR' ? 34 : tier==='R' ? 16 : 0;
  if (!n) return;
  const colors = { R:['#4d9de0'], SR:['#9d6cde','#c1a0f5'], SSR:['#e8b339','#f7dc8a','#fff3c4'], UR:['#e63946','#e8b339','#f7dc8a','#fff'] };
  const pal = colors[tier] || ['#fff'];
  const cx = window.innerWidth/2, cy = window.innerHeight*0.42;
  for (let i=0;i<n;i++){
    const p = document.createElement('i');
    p.className = 'pt';
    const a = (Math.PI*2*i)/n + Math.random()*0.4;
    const dist = 130 + Math.random()*300;
    const sz = 3 + Math.random()*6;
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;`+
      `background:${pal[i%pal.length]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;`+
      `animation-delay:${Math.random()*0.15}s`;
    box.appendChild(p);
  }
  setTimeout(()=>{ box.innerHTML='' }, 1900);
}

/* ---------- 工具 ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgURL = (base,q='low') => !base ? null : `${base}/${q}.${q==='low'?'webp':'png'}`;
const logoURL = base => !base ? null : `${base}.webp`;

function untilMidnight(){
  const now = new Date();
  const t = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0,0,0);
  const ms = t - now;
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000), s = Math.floor(ms%60000/1000);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function toast(msg){
  S.toast = msg; render();
  setTimeout(()=>{ S.toast = null; render() }, 2200);
}

/* 卡包信息：从池中反查 */
const SET_INDEX = (() => {
  const m = {};
  (POOL||[]).forEach(c => { if (c.set && !m[c.set]) m[c.set] = { id:c.set, name:c.setName } });
  return m;
})();
function POOL_SET(cardId){
  const m = /^(.*)-[^-]+$/.exec(cardId);
  const sid = m ? m[1] : cardId;
  const card = (POOL||[]).find(c => c.id === cardId);
  return { id:sid, name:card?.setName || sid, logo:null };
}

function pityBar(label, cur, max, cls, due){
  const pct = Math.min(100, (cur/max)*100);
  return `<div class="it">

      <b>${cur} / ${max}</b></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

function verifyToday(){

function exportData(){

function clearData(){
  if (!confirm('确定清空抽卡册？\n\n结果由日期决定，清空后可用「按日期重建记录」恢复。')) return;
  S.st = { version:1, draws:[], streak:0, lastDrawDate:null };
  save(S.st); S.drawResult = null; S.flipped = false; render();

function rebuildData(){
  const start = prompt('从哪一天开始重建？（YYYY-MM-DD）', addDays(S.today,-30));
  if (!start || !/^\d{4}-\d{2}-\d{2}$/.test(start)) return;
  const days = daysBetween(start, S.today);
  const draws = [];
  for (const d of days){
    const r = drawFor(d);
    draws.push({ date:d, cardId:r.card.id, tier:r.tier, rarity:r.card.rarity||'',
                 name:r.card.name, image:r.card.image||null, isPity:r.pity, revealedAt:0 });
  }
  S.st.draws = draws;
  S.st.lastDrawDate = S.today;
  S.st.streak = days.length;
  save(S.st); render();
  toast(`已重建 ${days.length} 天记录`);
}

/* ================= P4 卡片详情 ================= */
async function openModal(cardId){
  S.modal = { loading:true };
  render();
  // 优先用本地池
  const local = (POOL||[]).find(c => c.id === cardId);
  if (local){ S.modal = local; render(); }
  // 异步补完整详情（招式等）
  try {
    const r = await fetch(`https://api.tcgdex.net/v2/en/cards/${encodeURIComponent(cardId)}`);
    if (r.ok){ const full = await r.json(); S.modal = { ...local, ...full, tier: local?.tier }; }
    else if (!local) S.modal = { error:'未找到该卡' };
  } catch {
    if (!local) S.modal = { error:'网络不可用，且本地池中无此卡' };
  }
  render();
}
function closeModal(){ S.modal = null; render(); }

  const tier = m.tier || tierOf(m.rarity);
  const big = m.image ? imgURL(m.image,'high') : null;
  const small = m.image ? imgURL(m.image,'low') : null;
  // 这张卡的获取历史
  const hist = S.st.draws.filter(d => d.cardId === m.id).sort((a,b)=>a.date.localeCompare(b.date));

  const atk = (m.attacks||[]).map(a => `<div class="atk">
    <div class="r1">
      <span>${(a.cost||[]).map(t=>`<i class="energy" style="background:${
        ({Grass:'#3fa34d',Fire:'#e04b2c',Water:'#3b8fd4',Lightning:'#e8c02a',Psychic:'#a55cc4',
          Fighting:'#c0653a',Darkness:'#4a4458',Metal:'#8b93a3',Fairy:'#e07bb0',Dragon:'#b8912f',
          Colorless:'#c8ccd4'}[t]||'#888')})"></i>`).join('')}</span>
      <span class="an">${esc(a.name)}</span>
      ${a.damage!=null?`<span class="ad">${esc(a.damage)}</span>`:''}
    </div>
    ${a.effect?`<div class="ef">${esc(a.effect)}</div>`:''}</div>`).join('');

  return `<div class="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="x" onclick="closeModal()">×</button>
    <div class="mbody">
      <div class="mleft">
        ${big?`<img src="${big}" alt="${esc(m.name)}" onerror="this.onerror=null;this.src='${small||''}'">`
             :`<div class="empty">无卡图</div>`}
        <div class="kv">
          ${m.localId?`<span class="k">编号</span><span>${esc(m.localId)}${
            m.set?.cardCount?.official?` / ${esc(m.set.cardCount.official)}`:''}</span>`:''}
          ${m.category?`<span class="k">类别</span><span>${esc(m.category)}</span>`:''}
          ${m.rarity?`<span class="k">稀有度</span><span>${esc(m.rarity)} → <b class="p-${tier}"
            style="padding:0 6px;border-radius:8px">${tier}</b></span>`:''}
          ${m.illustrator?`<span class="k">画师</span><span>${esc(m.illustrator)}</span>`:''}
          ${m.hp!=null?`<span class="k">HP</span><span>${esc(m.hp)}</span>`:''}
          ${m.stage?`<span class="k">阶段</span><span>${esc(m.stage)}</span>`:''}
        </div>
      </div>
      <div class="mright">
        <h2>${esc(m.name)}</h2>
        <div style="color:var(--ink2);font-size:13px">${esc(m.set?.name || m.setName || '')}</div>
        <div class="badgerow" style="justify-content:flex-start;margin:12px 0">
          <span class="pill p-${tier}">${tier} · ${TIER_LABEL[tier]}</span>
          ${(m.types||[]).map(t=>`<span class="mini">${esc(t)}</span>`).join('')}
        </div>

        ${m.description?`<div class="sec"><h4>图鉴描述</h4>
          <div style="font-size:13px;color:var(--ink2)">${esc(m.description)}</div></div>`:''}

        ${atk?`<div class="sec"><h4>招式</h4>${atk}</div>`:''}

        ${(m.weaknesses?.length||m.retreat!=null)?`<div class="sec"><h4>对战数据</h4>
          <div class="kv">
            ${m.weaknesses?.length?`<span class="k">弱点</span><span>${
              m.weaknesses.map(w=>`${esc(w.type)} ${esc(w.value)}`).join(' · ')}</span>`:''}
            ${m.retreat!=null?`<span class="k">撤退费</span><span>${esc(m.retreat)}</span>`:''}
          </div></div>`:''}

        <div class="sec"><h4>获取历史</h4>
          ${hist.length ? `<div style="font-size:13px;color:var(--ink2)">
              在抽卡册中出现 <b style="color:var(--gold2)">${hist.length}</b> 次：
              ${hist.map(h=>`<span class="mini" style="margin:2px">${h.date}${h.isPity?' 保底':''}</span>`).join('')}
            </div>`
          : `<div style="font-size:13px;color:var(--ink3)">尚未获得过这张卡。</div>`}
        </div>

        <div class="note" style="margin-top:16px">
          卡片数据来自 TCGdex（<code>GET /en/cards/${esc(m.id)}</code>），卡图来自 assets.tcgdex.net。
        </div>
      </div>
    </div>
  </div></div>`;
}

/* ---------- 倒计时 ---------- */
setInterval(() => {
  const el = document.getElementById('cd');
  if (el) el.textContent = untilMidnight();
  // 跨日自动刷新
  const now = localDate();
  if (now !== S.today){
    S.today = now; S.flipped = false; S.drawResult = null;
    render();
  }
}, 1000);

/* ---------- 启动 ---------- */
(function init(){
  window.S = S; window.go = go; window.doDraw = doDraw; window.openModal = openModal;
  window.closeModal = closeModal; window.verifyToday = verifyToday;
  window.exportData = exportData; window.clearData = clearData; window.rebuildData = rebuildData;
  window.runVerify = runVerify;
  document.getElementById('nb-draw').classList.add('on');
  const n = (POOL||[]).length;
  const tk = {}; TIERS.forEach(t => tk[t] = (BUCKETS[t]||[]).length);
  console.log('[DailyDraw] 卡池', n, '张 ·', TIERS.map(t=>`${t}:${tk[t]}`).join(' '));
  render();
})();
</script>
</body>
</html>
